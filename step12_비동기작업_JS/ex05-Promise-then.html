<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Promise-then 활용</h1>
    <script>
        console.log('Start');
        const taskA = () => {
            return new Promise((resolve, reject) => {
                setTimeout(()=>{
                    resolve('One');
                }, 2000)
            });
        };

        const taskB = () => {
            return new Promise((resolve, reject) => {
                setTimeout(()=>{
                    resolve('Two');
                }, 1000)
            });
        };

        const taskC = () => {
            return new  Promise((resolve, reject) => {
                setTimeout(()=>{
                    resolve('Three');
                }, 1500)
            });
        };

        /*  -------------------------  */
        // 호출 - 단순 순차적 호출로는 불러올 수 없음. -> 결과가 Promise이므로
        // taskA();
        // taskB();
        // taskC();
        taskA()
        .then((re)=>{
            console.log('taskA : ' + re);
            return taskB();
        }) // return 값이 taskB()이고 taskB() 함수의 return 값 또한 Promise 객체이므로 then() 사용 가능.
        .then((re2)=>{
            console.log('taskB : ' + re2);
            return taskC();
        })
        .then((re3)=>{
            console.log('taskC : ' + re3);
        })
        .catch()
        .finally(()=>console.log('비동기 함수들의 동기적 작업 완료'));
        console.log('End');
    </script>
</body>
</html>
